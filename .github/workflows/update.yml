name: Update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install update tools
        run: pacman -Syu --noconfirm git github-cli python sudo

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create non-root builder
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Update package metadata
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo -u builder --preserve-env=GITHUB_TOKEN python scripts/update-version.py
          if git diff --quiet -- packages/podkit-bin/PKGBUILD packages/podkit-bin/.SRCINFO; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source packages/podkit-bin/PKGBUILD
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"

      - name: Create or refresh update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          branch="update-podkit-$VERSION"
          release_url="https://github.com/jvgomg/podkit/releases/tag/podkit%40$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add packages/podkit-bin/PKGBUILD packages/podkit-bin/.SRCINFO
          git commit -m "Update podkit-bin to $VERSION"
          git push --force-with-lease origin "$branch"
          body="$(printf 'Upstream release: %s\n\nRelease notes: %s\n\nManual review required: confirm upstream licensing, runtime dependencies, archive layout, and native package checks before merge.' "$release_url" "$release_url")"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Update podkit-bin to $VERSION" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Update podkit-bin to $VERSION" --body "$body"
          fi
          gh workflow run check.yml --ref "$branch"

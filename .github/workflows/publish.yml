name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm git namcap sudo

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create non-root builder
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate packages
        run: sudo -u builder scripts/check-packages.sh

  publish:
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mirror packages to AUR
        env:
          AUR_EMAIL: ${{ vars.AUR_EMAIL }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ vars.AUR_USERNAME }}
        run: |
          : "${AUR_USERNAME:?AUR_USERNAME repository variable is required}"
          : "${AUR_EMAIL:?AUR_EMAIL repository variable is required}"
          : "${AUR_KNOWN_HOSTS:?AUR_KNOWN_HOSTS repository secret is required}"
          : "${AUR_SSH_PRIVATE_KEY:?AUR_SSH_PRIVATE_KEY repository secret is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur-packages
          chmod 600 ~/.ssh/known_hosts ~/.ssh/aur-packages
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur-packages -o IdentitiesOnly=yes'

          for package_dir in packages/*; do
            [[ -f "$package_dir/PKGBUILD" ]] || continue
            package_name="$(basename "$package_dir")"
            checkout="aur-$package_name"
            git clone "ssh://aur@aur.archlinux.org/$package_name.git" "$checkout"
            git -C "$checkout" rm -rf --ignore-unmatch .
            cp -a "$package_dir/." "$checkout/"
            git -C "$checkout" add -A
            if git -C "$checkout" diff --cached --quiet; then
              echo "$package_name already matches; nothing to publish."
              continue
            fi
            source "$package_dir/PKGBUILD"
            git -C "$checkout" config user.name "$AUR_USERNAME"
            git -C "$checkout" config user.email "$AUR_EMAIL"
            git -C "$checkout" commit -m "$package_name $pkgver-$pkgrel"
            git -C "$checkout" push origin master
          done
